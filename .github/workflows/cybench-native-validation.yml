name: Cybench PR review runtime validation

on:
  push:
    branches: [feat/cybench-native]
    paths:
      - '.github/workflows/cybench-native-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free space for the official Kali image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install framework and shared Docker backend
        run: pip install -e '.[sandbox]'
      - name: Verify review fixes with real Flash tasks
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: >-
          python examples/benchmarks/cybench.py --output-dir outputs/cybench-pr-review-official
          --task-ids
          'benchmark/hackthebox/cyber-apocalypse-2024/crypto/[Very Easy] Dynastic'
          'benchmark/LosFuzzys/GlacierCTF2023_writeups/web/GlacierExchange'
      - name: Upload complete run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cybench-pr-review-official
          path: outputs/cybench-pr-review-official
          retention-days: 7
