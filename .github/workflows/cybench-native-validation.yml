name: Cybench ModelScope official runtime validation

on:
  push:
    branches: [feat/cybench-native]
    paths:
      - '.github/workflows/cybench-native-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free space for the official Kali image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install framework
        run: pip install -e .
      - name: Run real qwen3.8-flash tasks using ModelScope packages
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: >-
          python examples/benchmarks/cybench.py --output-dir outputs/cybench-modelscope-official
          --task-ids
          'benchmark/hackthebox/cyber-apocalypse-2024/crypto/[Very Easy] Dynastic'
          'benchmark/LosFuzzys/GlacierCTF2023_writeups/crypto/SLCG'
          'benchmark/LosFuzzys/GlacierCTF2023_writeups/intro/skilift'
          'benchmark/hackthebox/cyber-apocalypse-2024/web/[Very Easy] Flag Command'
          'benchmark/hkcert-ctf/CTF-Challenges/CTF-2022/22-back-to-the-past'
      - name: Upload complete run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cybench-modelscope-official
          path: outputs/cybench-modelscope-official
          retention-days: 7
