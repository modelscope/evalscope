name: Cybench native official runtime validation

on:
  push:
    branches: [feat/cybench-native]
    paths:
      - '.github/workflows/cybench-native-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free space for the official Kali image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install framework
        run: pip install -e .
      - name: Pull the exact official multi-platform image
        run: docker pull cybench/cybench@sha256:8a26be614f9d362ef7cdc61c26037884bee24af6c7ec62abf000462bb0623726
      - name: Real qwen3.8-flash evaluation
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: python examples/benchmarks/cybench.py --output-dir outputs/cybench-official-smoke
      - name: Upload predictions, reviews, reports and full traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cybench-official-runtime
          path: outputs/cybench-official-smoke
          retention-days: 7
