name: Deploy EvalScope website

on:
  push:
    branches: [website]
    paths: ['website/**', '.github/workflows/website.yml', 'evalscope/benchmarks/_meta/**']
  pull_request:
    branches: [website]
    paths: ['website/**', '.github/workflows/website.yml', 'evalscope/benchmarks/_meta/**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
        working-directory: website
      - run: npm run verify
        working-directory: website
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist
  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
