[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalscope-decision-ppu-compat"
version = "0.1.0"
description = "Register the existing causal Qwen3.5 implementation in PPU vLLM 0.20.1"

[project.entry-points."vllm.general_plugins"]
evalscope_decision_ppu = "decision_ppu:register"

[tool.setuptools]
py-modules = ["decision_ppu", "decision_ppu_model"]
