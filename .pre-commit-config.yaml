repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks.git
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # These upstream fixtures are literal tool observations; preserve their bytes.
        exclude: evalscope/third_party/|docs/|examples|^evalscope/benchmarks/agentharm/upstream/(harmful|benign|common)_tools/content/
      - id: check-yaml
        exclude: evalscope/third_party/|docs/|examples
      - id: end-of-file-fixer
        exclude: evalscope/third_party/|docs/|examples|.*\.json|^evalscope/benchmarks/agentharm/upstream/(harmful|benign|common)_tools/content/
      - id: requirements-txt-fixer
        exclude: evalscope/third_party/|docs/|examples
      - id: check-merge-conflict
        exclude: evalscope/third_party/|docs/|examples
      - id: mixed-line-ending
        exclude: evalscope/third_party/|docs/|examples
        args: ["--fix=lf"]
